[workspace]
name = "weft-backend"
version = "1.0.0"
description = "Weft backend — parse, align (DIAMOND), group, order → figure JSON"
channels = ["conda-forge", "bioconda"]
# linux-64 is what the deploy image builds against (it carries the DIAMOND binary
# from bioconda); osx-arm64 is local dev.
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.11.*"
fastapi = "*"
uvicorn = ">=0.52.1,<0.53"
python-multipart = "*"
pydantic = ">=2"
biopython = "*"
gffutils = "*"
numpy = "*"
scipy = "*"
diamond = "*"
parasail-python = "*"

[tasks]
dev = "uvicorn app.main:app --reload --port 8000"
