# Render blueprint for the Syntenic beta (https://render.com/docs/blueprint-spec).
# One Docker web service serving both /api and the built client. Render injects
# PORT and provides HTTPS + a domain. Fly.io is an equivalent alternative.
services:
  - type: web
    name: syntenic
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 512 MB (starter) works for parasail on small inputs; bump if you raise caps.
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Conservative open-beta guards (see backend/app/config.py). Tune per plan.
      - key: MAX_TOTAL_GENES
        value: "6000"
      - key: MAX_CLUSTERS
        value: "100"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_UPLOAD_BYTES
        value: "52428800" # 50 MB
      - key: SCRATCH_TTL_SECONDS
        value: "1800" # auto-delete uploads after 30 min
